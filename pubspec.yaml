name: spendly
description: "Spendly - offline-first personal finance app"
publish_to: 'none'
version: 1.5.1+8

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  drift: ^2.25.0
  sqlite3_flutter_libs: ^0.5.41
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  logger: ^2.5.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  fl_chart: ^0.71.0
  intl: ^0.20.2
  google_fonts: ^6.2.1
  lucide_icons_flutter: ^3.0.6
  google_sign_in: ^6.2.2
  googleapis: ^14.0.0
  googleapis_auth: ^1.6.0
  http: ^1.2.2
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  local_auth: ^3.0.1
  url_launcher: ^6.3.0
  pdf: ^3.12.0
  share_plus: ^12.0.2
  package_info_plus: ^9.0.1
  file_picker: ^11.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.25.1
  riverpod_generator: ^2.6.4
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  fonts:
    - family: General Sans
      fonts:
        - asset: assets/fonts/general_sans/GeneralSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/general_sans/GeneralSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/general_sans/GeneralSans-Semibold.ttf
          weight: 600
        - asset: assets/fonts/general_sans/GeneralSans-Bold.ttf
          weight: 700
  assets:
    - assets/icons/ic_launcher_round.png
    - assets/fonts/lucide/

flutter_launcher_icons:
  android: true
  ios: false

  image_path_android: "assets/icons/ic_launcher.png"
  adaptive_icon_foreground: "assets/icons/ic_launcher_foreground.png"
  adaptive_icon_monochrome: "assets/icons/ic_launcher_round.png"
  adaptive_icon_background: "#000000"
